name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  server:
    name: Server (typecheck + tests on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradexlabel
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: tradexlabel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradexlabel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: 'postgresql://tradexlabel:ci_test@localhost:5432/tradexlabel_test'
      JWT_SECRET: 'ci-test-jwt-secret-must-be-long-enough'
      JWT_REFRESH_SECRET: 'ci-test-refresh-secret-must-be-long-enough'
      NODE_ENV: 'test'
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps (workspace)
        working-directory: .
        run: npm ci

      # @tradexlabel/shared resolves to packages/shared/dist (main/types), which
      # is git-ignored: it must be built before anything imports it. First CI
      # run on GitHub failed on 19 "Cannot find module '@tradexlabel/shared'".
      - name: Build shared package
        working-directory: .
        run: npm run build --workspace=@tradexlabel/shared

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to PostgreSQL
        run: npx prisma migrate deploy

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # Sprint 6.3 / 6.7 / 7.7 / 7.8: ESLint is a real gate. The legacy
      # `any` count went 199 → 100 (Sprint 7.7) → 0 (Sprint 7.8 retyped
      # crm/routes.ts). The budget is now zero — any new `any` warning
      # blocks the build and forces a deliberate type decision.
      - name: ESLint
        run: npx eslint 'src/**/*.ts' --max-warnings=0

      # Sprint 6.3: npm audit gates on high+ severity. Drop the `|| true` so
      # known CVEs in production deps actually fail the build. Use
      # `npm audit --omit=dev` so dev-only tooling doesn't block.
      - name: npm audit (server prod deps)
        working-directory: .
        run: npm audit --omit=dev --audit-level=high

      - name: Vitest
        run: npx vitest run

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps (workspace)
        working-directory: .
        run: npm ci

      - name: Build shared package
        working-directory: .
        run: npm run build --workspace=@tradexlabel/shared

      - name: Generate Prisma client (needed by shared types)
        working-directory: packages/server
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:6500'
        run: npx next build

  # Sprint 9.5 — Build both container images on every push/PR so the
  # Dockerfiles can never rot silently (the Sprint 7.2 Dockerfile was merged
  # without ever being built). Images are built, smoke-tested and discarded;
  # publishing to a registry is a separate, release-only workflow.
  docker-images:
    name: Docker (api full + regulated, web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build api image (BUILD_PROFILE=full)
        run: docker build -f packages/server/Dockerfile -t tradexlabel/api:ci .

      - name: Build api image (BUILD_PROFILE=regulated)
        run: docker build -f packages/server/Dockerfile --build-arg BUILD_PROFILE=regulated -t tradexlabel/api:ci-regulated .

      # Sprint 7.5 promise, now enforced: the regulated image must contain
      # no dealer code at all, and the full image must contain it.
      - name: Assert dealer module presence per profile
        run: |
          set -e
          docker run --rm tradexlabel/api:ci sh -c 'test -d packages/server/dist/modules/dealer' \
            && echo "full image: dealer module present (expected)"
          if docker run --rm tradexlabel/api:ci-regulated sh -c 'test -e packages/server/dist/modules/dealer'; then
            echo "regulated image still contains dealer code" >&2; exit 1
          fi
          echo "regulated image: no dealer module (expected)"

      - name: Boot api image against a throwaway Postgres and hit /health
        run: |
          set -e
          docker network create ci-net
          docker run -d --name ci-pg --network ci-net \
            -e POSTGRES_USER=tradexlabel -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=tradexlabel postgres:16-alpine
          for i in $(seq 1 30); do docker exec ci-pg pg_isready -U tradexlabel && break; sleep 1; done
          docker run --rm --network ci-net \
            -e DATABASE_URL=postgresql://tradexlabel:ci@ci-pg:5432/tradexlabel \
            -w /app/packages/server tradexlabel/api:ci npx prisma migrate deploy
          docker run -d --name ci-api --network ci-net -p 5500:5500 \
            -e DATABASE_URL=postgresql://tradexlabel:ci@ci-pg:5432/tradexlabel \
            -e JWT_SECRET=ci-test-jwt-secret-must-be-long-enough \
            -e JWT_REFRESH_SECRET=ci-test-refresh-secret-must-be-long-enough \
            -e ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e METRICS_AUTH_TOKEN=ci-metrics -e CORS_ALLOWED_ORIGINS=http://localhost \
            tradexlabel/api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5500/api/v1/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5500/api/v1/health
          docker logs ci-api | tail -20

      - name: Build web image
        run: docker build -f packages/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:5500 -t tradexlabel/web:ci .

      - name: Boot web image and fetch /
        run: |
          set -e
          docker run -d --name ci-web -p 3000:3000 tradexlabel/web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -fsS -o /dev/null -w "web / -> %{http_code}\n" http://127.0.0.1:3000/
