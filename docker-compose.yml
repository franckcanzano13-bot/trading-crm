version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradexlabel-postgres
    environment:
      POSTGRES_USER: tradexlabel
      POSTGRES_PASSWORD: tradexlabel_dev
      POSTGRES_DB: tradexlabel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradexlabel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradexlabel-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sprint 7.2 — API container exercising the multi-stage Dockerfile.
  # `migrate` is a one-shot job that runs prisma migrate deploy and exits;
  # `api` waits for it via depends_on with service_completed_successfully.
  migrate:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    image: tradexlabel/api:dev
    container_name: tradexlabel-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tradexlabel:tradexlabel_dev@postgres:5432/tradexlabel
    working_dir: /app/packages/server
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    image: tradexlabel/api:dev
    container_name: tradexlabel-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://tradexlabel:tradexlabel_dev@postgres:5432/tradexlabel
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-please-change-in-prod-min-16-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-please-change-in-prod-min-16-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      NODE_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RUN_AS_API_ONLY: "1"
      # Sprint 7.5: dealer module disabled by default. Set to "1" to load it
      # (only meaningful for B_BOOK_DEALER tenants). Regulated brokers should
      # also build with --build-arg BUILD_PROFILE=regulated to strip the code.
      ENABLE_DEALER_MODULE: ${ENABLE_DEALER_MODULE:-0}
    ports:
      - "5500:5500"

  position-monitor:
    image: tradexlabel/api:dev
    container_name: tradexlabel-position-monitor
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://tradexlabel:tradexlabel_dev@postgres:5432/tradexlabel
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-please-change-in-prod-min-16-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-please-change-in-prod-min-16-chars}
      NODE_ENV: production
    command: ["node", "packages/server/dist/workers/position-monitor-worker.js"]

  # Sprint 9.4 — Next.js front-end (standalone build, packages/web/Dockerfile).
  # NEXT_PUBLIC_API_URL is baked into the browser bundle at build time: set it
  # to the public API origin (e.g. https://api.broker.example) or leave it
  # empty so the browser calls /api and /ws on the web origin and Next's
  # rewrites proxy them to the api container.
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_INTERNAL_URL: http://api:5500
    image: tradexlabel/web:dev
    container_name: tradexlabel-web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
